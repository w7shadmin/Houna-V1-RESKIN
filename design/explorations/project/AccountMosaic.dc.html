<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const info = [{"name":"First breath","how":"Lit · Finish your first session"},{"name":"First light","how":"Lit · 3 days in a row"},{"name":"Sunrise","how":"Lit · 7 days in a row"},{"name":"The sun","how":"14 days in a row"},{"name":"Half moon","how":"30 days in a row"},{"name":"Full moon","how":"100 days in a row"},{"name":"Every breath","how":"Lit · Try all four breathing exercises"},{"name":"Every scene","how":"Meditate with all four scenes"},{"name":"Every sky","how":"Visit the sunrise, the dusk and the starfield"}];
    const s = this.state.sel, v = { name: info[s].name, how: info[s].how };
    for (let k = 0; k < 9; k++) {
      v['s' + k] = k === s ? '#F2ECDD' : 'rgba(242,236,221,0.28)';
      v['w' + k] = k === s ? 2.5 : 1;
      v['pick' + k] = () => this.setState({ sel: k });
    }
    return v;
  }
}
