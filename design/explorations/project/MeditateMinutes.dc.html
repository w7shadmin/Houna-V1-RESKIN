<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meditate — minutes wheel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=DM+Mono:wght@400;500&amp;family=Figtree:wght@300;400;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&amp;family=Marcellus&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
@keyframes twinkle { 0%,100% { opacity: 0.25 } 50% { opacity: 1 } }
@keyframes drift { 0% { transform: translate(0,0) scale(1) } 50% { transform: translate(24px,-18px) scale(1.08) } 100% { transform: translate(0,0) scale(1) } }
@keyframes drift2 { 0% { transform: translate(0,0) scale(1.05) } 50% { transform: translate(-30px,22px) scale(0.95) } 100% { transform: translate(0,0) scale(1.05) } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes spinBack { to { transform: rotate(-360deg) } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes glowPulse { 0%,100% { opacity: 0.55 } 50% { opacity: 1 } }
@keyframes bars { 0%,100% { transform: scaleY(0.35) } 50% { transform: scaleY(1) } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; font-family: 'Figtree', system-ui, sans-serif; background: #06091A">

<button type="button" aria-label="Back" style="position: absolute; left: 12px; top: 56px; width: 48px; height: 48px; border: 0; background: none; color: #F2ECDD; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex-shrink: 0"><path d="M20 12H5M11 6l-6 6 6 6"></path></svg></button>
<div style="position: absolute; left: 90px; top: 58px; display: flex; gap: 28px; font-size: 16.5px">
<span style="padding: 12px 4px; color: #8990B5">Breathe</span>
<span style="padding: 12px 4px; color: #F2ECDD; border-bottom: 1.5px solid #F2ECDD">Meditate</span>
</div>
<div style="position: absolute; left: 0; right: 0; top: 236px; height: 380px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%)">
<div style="position: absolute; left: 0; right: 0; top: 0; transform: translateY({{ty}}px); transition: transform 600ms cubic-bezier(.25,1.1,.4,1)"><button type="button" onClick="{{pick0}}" style="height: 76px; width: 100%; border: 0; background: none; cursor: pointer; display: flex; align-items: baseline; justify-content: center; gap: 10px; color: #F2ECDD; opacity: {{op0}}; transform: scale({{sc0}}); transition: opacity 500ms ease, transform 500ms cubic-bezier(.3,1.2,.5,1)"><span style="font-weight: 300; font-size: 52px; line-height: 76px; font-variant-numeric: tabular-nums">5</span><span style="font-size: 26px; font-weight: 300; opacity: {{uo0}}; transition: opacity 400ms ease">min</span></button><button type="button" onClick="{{pick1}}" style="height: 76px; width: 100%; border: 0; background: none; cursor: pointer; display: flex; align-items: baseline; justify-content: center; gap: 10px; color: #F2ECDD; opacity: {{op1}}; transform: scale({{sc1}}); transition: opacity 500ms ease, transform 500ms cubic-bezier(.3,1.2,.5,1)"><span style="font-weight: 300; font-size: 52px; line-height: 76px; font-variant-numeric: tabular-nums">10</span><span style="font-size: 26px; font-weight: 300; opacity: {{uo1}}; transition: opacity 400ms ease">min</span></button><button type="button" onClick="{{pick2}}" style="height: 76px; width: 100%; border: 0; background: none; cursor: pointer; display: flex; align-items: baseline; justify-content: center; gap: 10px; color: #F2ECDD; opacity: {{op2}}; transform: scale({{sc2}}); transition: opacity 500ms ease, transform 500ms cubic-bezier(.3,1.2,.5,1)"><span style="font-weight: 300; font-size: 52px; line-height: 76px; font-variant-numeric: tabular-nums">20</span><span style="font-size: 26px; font-weight: 300; opacity: {{uo2}}; transition: opacity 400ms ease">min</span></button><button type="button" onClick="{{pick3}}" style="height: 76px; width: 100%; border: 0; background: none; cursor: pointer; display: flex; align-items: baseline; justify-content: center; gap: 10px; color: #F2ECDD; opacity: {{op3}}; transform: scale({{sc3}}); transition: opacity 500ms ease, transform 500ms cubic-bezier(.3,1.2,.5,1)"><span style="font-weight: 300; font-size: 52px; line-height: 76px; font-variant-numeric: tabular-nums">∞</span><span style="font-size: 26px; font-weight: 300; opacity: {{uo3}}; transition: opacity 400ms ease">open</span></button></div>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 636px; display: flex; gap: 10px"><div style="flex: 1; height: 76px; border-radius: 20px; background: rgba(242,236,221,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 13.5px; color: #8990B5">Start &amp; end</span><span style="font-size: 17px; color: #F2ECDD">Chime</span></div><div style="flex: 1; height: 76px; border-radius: 20px; background: rgba(242,236,221,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 13.5px; color: #8990B5">Sound</span><span style="font-size: 17px; color: #F2ECDD">Rain</span></div><div style="flex: 1; height: 76px; border-radius: 20px; background: rgba(242,236,221,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 13.5px; color: #8990B5">Screen</span><span style="font-size: 17px; color: #F2ECDD">Dim</span></div></div>
<button type="button" aria-label="Play" style="position: absolute; left: 150px; top: 736px; width: 90px; height: 90px; border-radius: 999px; border: 1.5px solid #F2ECDD; background: none; color: #F2ECDD; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex-shrink: 0"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 1 };
  }
  renderVals() {
    const s = this.state.sel;
    const v = { ty: 152 - s * 76 };
    for (let k = 0; k < 4; k++) {
      const d = Math.abs(k - s);
      v['op' + k] = d === 0 ? 1 : d === 1 ? 0.45 : 0.2;
      v['sc' + k] = d === 0 ? 1.12 : 0.9;
      v['uo' + k] = d === 0 ? 1 : 0;
      v['pick' + k] = () => this.setState({ sel: k });
    }
    return v;
  }
}
</script>
</body>
</html>
