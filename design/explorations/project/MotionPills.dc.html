<title>Motion — glowing pills, three themes</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=DM+Mono:wght@400;500&amp;family=Figtree:wght@300;400;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&amp;family=Marcellus&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
@keyframes twinkle { 0%,100% { opacity: 0.25 } 50% { opacity: 1 } }
@keyframes drift { 0% { transform: translate(0,0) scale(1) } 50% { transform: translate(24px,-18px) scale(1.08) } 100% { transform: translate(0,0) scale(1) } }
@keyframes drift2 { 0% { transform: translate(0,0) scale(1.05) } 50% { transform: translate(-30px,22px) scale(0.95) } 100% { transform: translate(0,0) scale(1.05) } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes spinBack { to { transform: rotate(-360deg) } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes glowPulse { 0%,100% { opacity: 0.55 } 50% { opacity: 1 } }
@keyframes bars { 0%,100% { transform: scaleY(0.35) } 50% { transform: scaleY(1) } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
@keyframes ringTurn { to { transform: rotate(360deg) } }
.pill:active { opacity: 0.85 }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; font-family: 'Figtree', system-ui, sans-serif; background: #0B1026">
<div style="position: absolute; left: 0; right: 0; top: 40px; height: 260px; background: #0B1026; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 32px; box-sizing: border-box">

<span aria-hidden="true" style="position: absolute; left: -6px; right: -6px; top: 4px; bottom: -10px; border-radius: 999px; background: linear-gradient(90deg, #6FD6CF, #B3A7F5, #F2B880, #EA90A8); filter: blur(16px); opacity: 0.45; animation: glowPulse 5s ease-in-out infinite"></span>

</div>

</div><div style="position: absolute; left: 0; right: 0; top: 310px; height: 260px; background: #F5F1E8; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 32px; box-sizing: border-box">

<span aria-hidden="true" style="position: absolute; left: -6px; right: -6px; top: 4px; bottom: -10px; border-radius: 999px; background: linear-gradient(90deg, #6FD6CF, #B3A7F5, #F2B880, #EA90A8); filter: blur(16px); opacity: 0.45; animation: glowPulse 5s ease-in-out infinite"></span>
<button type="button" class="pill" style="position: absolute; inset: 0; border-radius: 999px; border: 0; background: #237873; color: #FFFFFF; font-size: 17px; font-weight: 600; cursor: pointer">Begin</button>
