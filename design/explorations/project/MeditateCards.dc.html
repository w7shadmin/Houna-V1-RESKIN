<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const s = this.state.sel;
    const names = ["Desert at dusk","Night oasis","Slow sea","Rain on glass"];
    const v = { tx: 59 - s * 290, name: names[s] };
    for (let k = 0; k < 4; k++) {
      v['b' + k] = s === k ? '#1B2140' : 'rgba(27,33,64,0.10)';
      v['s' + k] = s === k ? 1 : 0.94;
      v['d' + k] = s === k ? 1 : 0.22;
      v['pick' + k] = () => this.setState({ sel: k });
    }
    return v;
  }
}
</script>
