<div style="display: flex; flex-direction: column; gap: 22px; padding: 20px 20px 130px">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.16em; color: {{accent}}">DIRECTORY</span>

<button type="button" style="flex-shrink: 0; height: 40px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(29,43,42,0.12); color: #1D2B2A; font-family: 'DM Mono', monospace; font-size: 12.5px; letter-spacing: 0.1em">THERAPISTS</button>
<button type="button" style="flex-shrink: 0; height: 40px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(29,43,42,0.12); color: #1D2B2A; font-family: 'DM Mono', monospace; font-size: 12.5px; letter-spacing: 0.1em">PSYCHOLOGISTS</button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="6">
<a href="ProfessionalMorning.dc.html" style="display: flex; align-items: flex-start; gap: 14px; padding: 14px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(29,43,42,0.10)">
<span aria-hidden="true" style="flex-shrink: 0; width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 25%, {{p.hi}} 0, {{p.c}} 55%, {{p.lo}} 100%); font-family: 'Marcellus', serif; font-size: 22px; color: #1D2B2A">{{p.initials}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; font-weight: 600; color: #1D2B2A">{{p.name}}</span>
<span style="font-size: 13.5px; font-weight: 500; color: {{accent}}">{{p.role}}</span>
<sc-if value="{{p.hasDesc}}" hint-placeholder-val="{{ true }}">
<span style="margin-top: 2px; font-size: 13px; line-height: 1.45; color: #6D6F72">{{p.desc}}</span>
</sc-if>
</span>
</a>

</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#196662","options":["#196662","#0A91BB","#E8582C"]},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#196662';
    const tones = [
      { c: '#5CC2BE', hi: '#DDF5F3', lo: '#196662' },
      { c: '#20C4F4', hi: '#E4F6FD', lo: '#0A91BB' },
      { c: '#F9A980', hi: '#FFF1EA', lo: '#E8582C' },
      { c: '#5FB08E', hi: '#E8F4F0', lo: '#1C7454' }
    ];
    const raw = [
      { name: 'Nour Kaafarani', initials: 'NK', role: 'Behavioral Consultant – Program Lead', desc: 'Qualified Behavioral Consultant with a Master’s degree in Specialized Education…' },
      { name: 'Abeer Al-Mujaini', initials: 'AA', role: 'Mental Health Clinician (Child and Adolescent)', desc: 'Abeer is passionate about research in psychology and is working on several research…' },
      { name: 'Abir Tannir Itani, MA', initials: 'AI', role: 'Counseling Therapist', desc: 'Abir earned her Master’s degree in Counseling and her Bachelor’s degree in…' },
      { name: 'Abrar Abdullah', initials: 'AA', role: 'Psychotherapist', desc: '' },
      { name: 'Adel Suleiman', initials: 'AS', role: 'Behavioral Consultant – Program Lead', desc: 'Qualified Behavioral Consultant with a Master’s degree in Behavioral Studies from…' },
      { name: 'Ahmad Ali Alrababah', initials: 'AA', role: '[Role from houna.org]', desc: '' }
    ];
    const people = raw.map((p, i) => ({ ...p, ...tones[i % tones.length], hasDesc: !!p.desc }));
    return { accent, people };
  }
}
</script>
</body>
