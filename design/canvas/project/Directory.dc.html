<button type="button" style="flex-shrink: 0; height: 40px; padding: 0 18px; border-radius: 999px; background: rgba(242,236,221,0.06); border: 1px solid rgba(242,236,221,0.12); color: #F2ECDD; font-family: 'DM Mono', monospace; font-size: 12.5px; letter-spacing: 0.1em">THERAPISTS</button>
<button type="button" style="flex-shrink: 0; height: 40px; padding: 0 18px; border-radius: 999px; background: rgba(242,236,221,0.06); border: 1px solid rgba(242,236,221,0.12); color: #F2ECDD; font-family: 'DM Mono', monospace; font-size: 12.5px; letter-spacing: 0.1em">PSYCHOLOGISTS</button>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="6">
<a href="Professional.dc.html" style="display: flex; align-items: flex-start; gap: 14px; padding: 14px; border-radius: 22px; background: rgba(242,236,221,0.045); border: 1px solid rgba(242,236,221,0.10)">
<span aria-hidden="true" style="flex-shrink: 0; width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 25%, {{p.hi}} 0, {{p.c}} 55%, {{p.lo}} 100%); font-family: 'Marcellus', serif; font-size: 22px; color: #0B1026">{{p.initials}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; font-weight: 600; color: #F2ECDD">{{p.name}}</span>
<span style="font-size: 13.5px; font-weight: 500; color: {{accent}}">{{p.role}}</span>
<sc-if value="{{p.hasDesc}}" hint-placeholder-val="{{ true }}">
<span style="margin-top: 2px; font-size: 13px; line-height: 1.45; color: #8990B5">{{p.desc}}</span>

</nav>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6FD6CF","options":["#6FD6CF","#B3A7F5","#F2B880"]},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6FD6CF';
    const tones = [
      { c: '#6FD6CF', hi: '#D9FAF6', lo: '#2E8F8A' },
      { c: '#B3A7F5', hi: '#EEEAFF', lo: '#6A5CC4' },
      { c: '#F2B880', hi: '#FFF1E0', lo: '#B9713A' },
      { c: '#86A9F0', hi: '#E3ECFF', lo: '#3D5DB0' }
    ];
    const raw = [
      { name: 'Nour Kaafarani', initials: 'NK', role: 'Behavioral Consultant – Program Lead', desc: 'Qualified Behavioral Consultant with a Master’s degree in Specialized Education…' },
      { name: 'Abeer Al-Mujaini', initials: 'AA', role: 'Mental Health Clinician (Child and Adolescent)', desc: 'Abeer is passionate about research in psychology and is working on several research…' },
      { name: 'Abir Tannir Itani, MA', initials: 'AI', role: 'Counseling Therapist', desc: 'Abir earned her Master’s degree in Counseling and her Bachelor’s degree in…' },
      { name: 'Abrar Abdullah', initials: 'AA', role: 'Psychotherapist', desc: '' },
      { name: 'Adel Suleiman', initials: 'AS', role: 'Behavioral Consultant – Program Lead', desc: 'Qualified Behavioral Consultant with a Master’s degree in Behavioral Studies from…' },
      { name: 'Ahmad Ali Alrababah', initials: 'AA', role: '[Role from houna.org]', desc: '' }
    ];
    const people = raw.map((p, i) => ({ ...p, ...tones[i % tones.length], hasDesc: !!p.desc }));
    return { accent, people };
  }
}
</script>
