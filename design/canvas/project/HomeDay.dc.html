<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#237873","options":["#237873","#6353C9","#A8621F"]},"$preview":{"width":390,"height":844}}'>
// Lit countries on the land silhouette: the app's own positions (constants/worldDots.ts snapToLand), in its 200 × 99.4 frame.
const MARKERS = [["SA",119.9,50.2],["AE",124.4,50.2],["QA",122.2,50.2],["KW",119.9,46.3],["BH",121,48.2],["OM",126.7,50.2],["JO",114.2,44.3],["LB",114.2,44.3],["EG",110.8,46.3],["MA",89.2,44.3],["IQ",118.8,44.3],["GB",93.8,32.5],["DE",101.7,30.5],["US",50.6,40.3],["CA",52.8,36.4],["TR",111.9,40.3]];
const K = 1.59;
const PERIODS = [
  { label: '24H', text: 'in the last 24 hours', quote: 'Every breath here is shared with someone, somewhere.' },
  { label: 'WEEK', text: 'this week', quote: 'Small pauses, taken together, change a day.' },
  { label: 'MONTH', text: 'this month', quote: 'You are one light among many.' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ p: (this.state.p + 1) % 3 }), 4500);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const accent = this.props.accent ?? '#237873';
    const on = '#1B2140', ink = '#F5F1E8', off = '#646A8E';
    const N = 28, R = 86, C = 95;
    const dots = Array.from({ length: N }, (_, i) => {
      const t = i / N;
      const a = t * Math.PI * 2 - Math.PI / 2;
      const s = 2.5 + 4 * Math.sin(t * Math.PI);
      return { x: (C + R * Math.cos(a) - s / 2).toFixed(1), y: (C + R * Math.sin(a) - s / 2).toFixed(1), s: s.toFixed(1), o: (0.22 + 0.78 * Math.sin(t * Math.PI)).toFixed(2), c: i < N / 2 ? accent : '#6353C9' };
    });
    const p = this.state.p;
    const periods = PERIODS.map((x, k) => ({ label: x.label, sel: k === p ? 'true' : 'false', bg: k === p ? on : 'transparent', fg: k === p ? ink : off, pick: () => this.setState({ p: k }) }));
    const active = ['SA', 'AE', 'QA', 'KW', 'BH', 'OM', 'JO', 'LB', 'EG', 'MA', 'IQ', 'GB', 'DE', 'US', 'CA', 'TR'];
    const shown = active.slice(0, [8, 12, 16][p]);
    const map = MARKERS.filter(([code]) => shown.includes(code)).map(([code, x, y]) => ({ x: (x * K - 2.5).toFixed(1), y: (y * K - 2.5).toFixed(1) }));
    return { accent, dots, periods, map, periodText: PERIODS[p].text, quote: PERIODS[p].quote };
  }
}
