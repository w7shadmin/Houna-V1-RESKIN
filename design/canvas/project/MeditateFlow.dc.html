<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SCENES = [{"name":"Fire","desc":"A crackling, warm glow","glow":"240,168,104","video":true},{"name":"Rain","desc":"Steady rainfall to settle the mind","glow":"127,162,236","video":true},{"name":"Creek","desc":"A mountain stream flowing over stones","glow":"99,207,199","video":true},{"name":"Ocean","desc":"Slow, rolling waves","glow":"143,155,240","video":false}];
const SLOT = {"0":{"x":0,"s":1,"r":0,"o":1,"z":3},"1":{"x":116,"s":0.62,"r":-52,"o":0.7,"z":2},"2":{"x":0,"s":0.4,"r":0,"o":0,"z":1},"-1":{"x":-116,"s":0.62,"r":52,"o":0.7,"z":2}};
function relOf(k, cur) { var r = (k - cur + 4) % 4; return r === 3 ? -1 : r; }
function tf(sl) { return 'translateX(' + sl.x + 'px) rotateY(' + sl.r + 'deg) scale(' + sl.s + ')'; }
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cur: 0, n: 0 };
  }
  renderVals() {
    const { cur, n } = this.state;
    const go = (k) => () => { if (k !== cur) this.setState({ cur: k, n: n + 1 }); };
    const vals = { reflect: 0.22 };
    SCENES.forEach((sc, k) => {
      const rel = relOf(k, cur), sl = SLOT[rel];
      const c = 'c' + k;
      vals[c + 'tf'] = tf(sl); vals[c + 'o'] = sl.o; vals[c + 'z'] = sl.z;
      vals[c + 'shadow'] = rel === 0 ? '0 0 56px rgba(' + sc.glow + ',0.5)' : '0 0 0 rgba(0,0,0,0)';
      vals[c + 'cursor'] = rel === 0 ? 'default' : 'pointer';
      vals[c + 'label'] = rel === 0 ? sc.name + ', chosen' : rel === 2 ? sc.name : sc.name + (rel < 0 ? ', previous' : ', next');
      vals[c + 'pick'] = go(k);
      vals['pw' + k] = k === cur ? 22 : 6; vals['pc' + k] = k === cur ? '#F2ECDD' : '#8990B5'; vals['po' + k] = k === cur ? 1 : 0.45;
    });
    const sc = SCENES[cur];
    return Object.assign(vals, {
      glow: sc.glow, name: sc.name, desc: sc.desc, video: sc.video ? 'On' : 'Off',
      textAnim: n ? (n % 2 ? 'textA' : 'textB') + ' 420ms ease 140ms both' : 'none'
    });
  }
}
</script>
