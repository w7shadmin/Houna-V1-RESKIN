<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Self-reflection question (Sunrise)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Figtree:wght@400;500;600&amp;family=Marcellus&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F6F4;font-family:'Figtree',system-ui,sans-serif;color:#1D2B2A}
a{color:#1D2B2A;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: radial-gradient(80% 36% at 50% 22%, rgba(32,196,244,0.20), rgba(242,246,244,0) 72%), #F2F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #1D2B2A; display: flex; flex-direction: column; gap: 22px; padding: 20px 20px 40px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="TanafasMorning.dc.html" aria-label="Leave the questionnaire" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid rgba(29,43,42,0.12)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<span style="font-size: 15px; font-weight: 600; color: #1D2B2A">[Test name]</span>
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; color: #6D6F72"><span>QUESTION 4 OF [N]</span><span>~[M] MIN LEFT</span></div>
<div role="progressbar" aria-label="Progress" aria-valuenow="4" aria-valuemin="0" aria-valuemax="20" style="height: 4px; border-radius: 999px; background: rgba(29,43,42,0.12); overflow: hidden"><div style="width: 22%; height: 100%; border-radius: 999px; background: #0A91BB"></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 18px">
<span style="font-family: 'DM Mono', monospace; font-size: 11.5px; letter-spacing: 0.14em; color: #08799B">HOW MUCH DO YOU AGREE?</span>
<h1 style="margin: 0; font-family: 'Marcellus', serif; font-weight: 400; font-size: 28px; line-height: 1.22; color: #1D2B2A">[Statement from the questionnaire, as written by its authors]</h1>
</div>

<div role="radiogroup" aria-label="Your answer" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 18px; border-radius: 18px; background: {{o.bg}}; border: 1px solid {{o.border}}; color: #1D2B2A; font-family: 'Figtree', sans-serif; font-size: 15.5px; font-weight: 500; text-align: start">
<span aria-hidden="true" style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 999px; border: 2px solid {{o.ring}}; background: {{o.dot}}"></span>{{o.label}}</button>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; gap: 10px">
<button type="button" style="flex: 1; height: 54px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(29,43,42,0.16); color: #1D2B2A; font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 500">Back</button>
<a href="TestResultMorning.dc.html" style="flex: 2; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: #196662; color: #FFFFFF; font-size: 16px; font-weight: 600">Next</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const LABELS = ['Strongly disagree', 'Disagree', 'Neither agree nor disagree', 'Agree', 'Strongly agree'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: 3 };
  }
  renderVals() {
    const a = this.state.a;
    const options = LABELS.map((label, k) => {
      const on = k === a;
      return {
        label,
        checked: on ? 'true' : 'false',
        bg: on ? 'rgba(32,196,244,0.14)' : 'rgba(29,43,42,0.045)',
        border: on ? '#0A91BB' : 'rgba(29,43,42,0.10)',
        ring: on ? '#0A91BB' : 'rgba(29,43,42,0.35)',
        dot: on ? '#0A91BB' : 'transparent',
        pick: () => this.setState({ a: k })
      };
    });
    return { options };
  }
}
</script>
</body>
</html>
